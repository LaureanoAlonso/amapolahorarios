<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amapola – Control de Personal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root {
--bg: #0f0e0c; --surface: #1a1916; --card: #222118; --border: #2e2c26;
--accent: #e8b84b; --accent2: #d4471c; --text: #f0ede6; --muted: #7a7669;
--green: #4caf7d; --red: #e05c3a; --blue: #5b9bd5; --purple: #9b7fd5;
--orange: #e8934b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }

.header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: 0.08em; color: var(--accent); }
.logo span { color: var(--muted); font-weight: 400; font-size: 0.8rem; display: block; letter-spacing: 0.05em; }
.nav-tabs { display: flex; gap: 6px; }
.nav-tab { padding: 7px 16px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em; }
.nav-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
.nav-tab:hover:not(.active) { color: var(--text); border-color: var(--muted); }
